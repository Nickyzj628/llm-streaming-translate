<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>划词翻译调用链（Sequence）— LLM Streaming Translator</title>
<!--
  皮肤 token 提取自仓库 DESIGN.md front matter：
  primary #1A1A1A → ink / secondary #4A4A4A → muted / tertiary #0066FF → accent /
  neutral #FFFFFF → paper（按 skill 约束回退为暖白 #fafaf7）。
  来源：ARCHITECTURE.md §2 的 mermaid sequenceDiagram（16 条消息精简合并为 12 条）。

  重新生成 PNG（高分屏/文档缩放不糊）：用 headless 浏览器以 deviceScaleFactor=2
  打开本文件（等待 document.fonts.ready 后再截），仅截取 <svg> 元素区域导出，
  即可得到 2560x1600 的 architecture-sequence.png。SVG 为矢量，1x/2x 共用同一份
  HTML，不必改 viewBox。
-->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 页面排版：编辑风 minimal 变体 */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafaf7;            /* paper */
    color: #1A1A1A;                 /* ink */
    font-family: "Geist", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 1344px; margin: 0 auto; padding: 32px 32px 40px; }
  .eyebrow {
    font-family: "Geist Mono", monospace;
    font-size: 8px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #6E6E6E;                 /* soft */
    margin: 0 0 8px;
  }
  h1 {
    font-family: "Instrument Serif", serif;
    font-size: 28px; font-weight: 400;
    margin: 0 0 4px;
  }
  .subtitle { color: #4A4A4A; font-size: 12px; margin: 0 0 20px; }  /* muted */
  svg { display: block; width: 100%; height: auto; }
  .colophon {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid rgba(26,26,26,0.12);   /* rule */
    font-family: "Geist Mono", monospace;
    font-size: 8px; color: #6E6E6E;              /* soft */
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">LLM Streaming Translator · 调用链</p>
  <h1>划词翻译调用链（Sequence）</h1>
  <p class="subtitle">content 构造协议文本 → background 流式请求 LLM → 逐 chunk 写回锚点；序号错位时断点重试</p>

  <svg viewBox="0 0 1280 800" role="img" aria-labelledby="arch-seq-title arch-seq-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="arch-seq-title">划词翻译调用链</title>
    <desc id="arch-seq-desc">用户划词并点击翻译后，content 提取选区文本节点、构造含 {{segN}} 段标记与 {{varN}} 占位符的协议文本，经 stream-translate 长连接端口发送 START 给 background；background 读取设置校验后经 fetch + parseSSE 流式请求 LLM，并把 CHUNK 逐段转发回 content 写回锚点；流结束收到 DONE 后 content 做段数对齐校验并恢复原文结构；序号/段数错位时从错位段断点重试，最多 MAX_ATTEMPTS 次。</desc>

    <defs>
      <!-- 三个箭头 marker：muted 默认 / link 蓝（HTTP）/ accent 蓝（主成功路径） -->
      <marker id="arch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4A4A4A"/>
      </marker>
      <marker id="arch-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
      </marker>
      <marker id="arch-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#0066FF"/>
      </marker>
    </defs>

    <!-- 背景：clean paper，无点阵 -->
    <rect width="100%" height="100%" fill="#fafaf7"/>

    <!-- 1. lifeline（虚线）先画，消息线与节点盖在其上 -->
    <line x1="160" y1="96"  x2="160" y2="664" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="480" y1="96"  x2="480" y2="664" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="96"  x2="800" y2="664" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="1120" y1="96" x2="1120" y2="664" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 2. loop 组合片段框：覆盖 content / background / LLM 三条 lifeline -->
    <rect x="468" y="368" width="664" height="180" rx="4"
          fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.22)" stroke-width="1"/>
    <rect x="468" y="368" width="40" height="16" rx="2"
          fill="#fafaf7" stroke="rgba(26,26,26,0.22)" stroke-width="1"/>
    <text x="488" y="379" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
    <text x="480" y="396" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono', monospace" letter-spacing="0.04em">[流式返回]</text>

    <!-- 3. 消息线（箭头先于节点与激活条） -->
    <!-- 1 划选文本 -->
    <line x1="160" y1="132" x2="472" y2="132" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <!-- 2 点击翻译按钮 -->
    <line x1="160" y1="172" x2="472" y2="172" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <!-- 3 content 自消息：生成协议文本 -->
    <path d="M 480,212 v -16 h 28 v 16" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <!-- 4 建立连接发送 START -->
    <line x1="480" y1="252" x2="792" y2="252" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <!-- 5 background 自消息：读取设置并校验 -->
    <path d="M 800,292 v -16 h 28 v 16" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <!-- 6 流式请求 LLM（HTTP，link 蓝） -->
    <line x1="800" y1="332" x2="1112" y2="332" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
    <!-- 7 返回译文片段（loop 内，虚线返回） -->
    <line x1="1120" y1="404" x2="808" y2="404" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arch-arrow)"/>
    <!-- 8 转发 CHUNK（loop 内，虚线返回） -->
    <line x1="800" y1="444" x2="488" y2="444" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arch-arrow)"/>
    <!-- 9 content 自消息：按 segN 写回（loop 内） -->
    <path d="M 480,492 v -16 h 28 v 16" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <!-- 10 流结束（虚线返回） -->
    <line x1="1120" y1="564" x2="808" y2="564" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arch-arrow)"/>
    <!-- 11 发送完成通知 DONE（主成功路径，accent 实线） -->
    <line x1="800" y1="604" x2="488" y2="604" stroke="#0066FF" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
    <!-- 12 content 自消息：finish 校验与恢复 -->
    <path d="M 480,648 v -16 h 28 v 16" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>

    <!-- 4. 消息标签：不透明 paper mask + 文本，mask 与线保持 ≥6px 间隙 -->
    <!-- 1 划选文本（U→C） -->
    <rect x="216" y="88"  width="208" height="34" rx="2" fill="#fafaf7"/>
    <text x="320" y="102" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">划选文本</text>
    <text x="320" y="118" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">监听 mouseup / selectionchange</text>
    <!-- 2 点击翻译按钮（U→C） -->
    <rect x="200" y="128" width="240" height="34" rx="2" fill="#fafaf7"/>
    <text x="320" y="142" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">点击翻译按钮</text>
    <text x="320" y="158" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">浮动按钮 onClick → controller.start(range)</text>
    <!-- 3 生成协议文本（C 自消息） -->
    <rect x="504" y="156" width="160" height="34" rx="2" fill="#fafaf7"/>
    <text x="516" y="170" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">生成协议文本</text>
    <text x="516" y="186" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace">提取文本节点 · {{segN}} / {{varN}}</text>
    <!-- 4 建立连接，发送 START（C→B） -->
    <rect x="528" y="208" width="224" height="34" rx="2" fill="#fafaf7"/>
    <text x="640" y="222" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">建立连接，发送 START</text>
    <text x="640" y="238" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">runtime.connect("stream-translate")</text>
    <!-- 5 读取设置并校验（B 自消息） -->
    <rect x="820" y="236" width="148" height="34" rx="2" fill="#fafaf7"/>
    <text x="832" y="250" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">读取设置并校验</text>
    <text x="832" y="266" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace">baseUrl / model / body</text>
    <!-- 6 流式请求（B→LLM，link 蓝） -->
    <rect x="856" y="288" width="208" height="34" rx="2" fill="#fafaf7"/>
    <text x="960" y="302" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">流式请求</text>
    <text x="960" y="318" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">fetch + parseSSE（AbortController）</text>
    <!-- 7 返回译文片段（LLM→B，loop 内） -->
    <rect x="884" y="360" width="152" height="34" rx="2" fill="#fafaf7"/>
    <text x="960" y="374" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">返回译文片段</text>
    <text x="960" y="390" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">（流式 chunk）</text>
    <!-- 8 转发 CHUNK（B→C，loop 内） -->
    <rect x="564" y="400" width="152" height="34" rx="2" fill="#fafaf7"/>
    <text x="640" y="414" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">转发 CHUNK</text>
    <text x="640" y="430" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">port.postMessage</text>
    <!-- 9 按 segN 写回（C 自消息，loop 内；标签在线下方避免压线） -->
    <rect x="504" y="492" width="200" height="34" rx="2" fill="#fafaf7"/>
    <text x="516" y="506" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">按 {{segN}} 切分 + 序号校验</text>
    <text x="516" y="522" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace">逐段写回锚点</text>
    <!-- 10 流结束（LLM→B；标签在线下方） -->
    <rect x="884" y="576" width="152" height="22" rx="2" fill="#fafaf7"/>
    <text x="960" y="590" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">流结束</text>
    <!-- 11 发送完成通知 DONE（B→C，accent 主成功路径） -->
    <rect x="544" y="568" width="192" height="22" rx="2" fill="#fafaf7"/>
    <text x="640" y="582" fill="#0066FF" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">发送完成通知 DONE</text>
    <!-- 12 finish 校验与恢复（C 自消息；标签在线下方） -->
    <rect x="504" y="660" width="224" height="22" rx="2" fill="#fafaf7"/>
    <text x="516" y="676" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">finish()：段数对齐 + 恢复结构</text>

    <!-- 5. 激活条（消息箭头刺入其中） -->
    <rect x="476" y="116" width="8" height="544" fill="rgba(26,26,26,0.06)" stroke="#4A4A4A" stroke-width="0.8"/>
    <rect x="796" y="236" width="8" height="380" fill="rgba(26,26,26,0.06)" stroke="#4A4A4A" stroke-width="0.8"/>
    <rect x="1116" y="316" width="8" height="252" fill="rgba(26,26,26,0.06)" stroke="#4A4A4A" stroke-width="0.8"/>

    <!-- 6. 断点重试说明（Note over C） -->
    <rect x="436" y="696" width="448" height="32" rx="4"
          fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.22)" stroke-width="1"/>
    <text x="460" y="716" fill="#1A1A1A" font-size="12" font-weight="500"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">序号 / 段数错位时：从错位段重译（断点重试，最多 MAX_ATTEMPTS 次）</text>

    <!-- 7. actor 框（最后画，盖住 lifeline 顶端） -->
    <rect x="96"  y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="416" y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="736" y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="1056" y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#1A1A1A" stroke-width="1"/>
    <text x="160" y="68" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">用户</text>
    <text x="480" y="60" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">content</text>
    <text x="480" y="76" fill="#4A4A4A" font-size="9"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">页面脚本</text>
    <text x="800" y="60" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">background</text>
    <text x="800" y="76" fill="#4A4A4A" font-size="9"
          font-family="'Geist Mono','Noto Sans Mono CJK SC',monospace" text-anchor="middle">后台脚本</text>
    <text x="1120" y="68" fill="#1A1A1A" font-size="12" font-weight="600"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">AI 翻译接口</text>

    <!-- 8. 图例：底部水平条 -->
    <line x1="40" y1="748" x2="1240" y2="748" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
    <text x="40" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <!-- 调用 -->
    <line x1="120" y1="764" x2="176" y2="764" stroke="#4A4A4A" stroke-width="1.2" marker-end="url(#arch-arrow)"/>
    <text x="184" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">调用</text>
    <!-- 返回 -->
    <line x1="264" y1="764" x2="320" y2="764" stroke="#4A4A4A" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arch-arrow)"/>
    <text x="328" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">返回 / CHUNK</text>
    <!-- HTTP -->
    <line x1="424" y1="764" x2="480" y2="764" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arch-arrow-link)"/>
    <text x="488" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">HTTP 流式请求</text>
    <!-- 成功路径 -->
    <line x1="608" y1="764" x2="664" y2="764" stroke="#0066FF" stroke-width="1.4" marker-end="url(#arch-arrow-accent)"/>
    <text x="672" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">主成功路径</text>
    <!-- 自消息 -->
    <path d="M 784,764 v -8 h 12 v 8" fill="none" stroke="#4A4A4A" stroke-width="1.2"/>
    <text x="804" y="768" fill="#4A4A4A" font-size="8"
          font-family="'Geist','Noto Sans SC','Microsoft YaHei',sans-serif">自消息 / 本端动作</text>
  </svg>

  <p class="colophon">来源：ARCHITECTURE.md §2（mermaid sequenceDiagram）· 重绘：diagram-design（Sequence）· 皮肤：DESIGN.md front matter 提取（#1A1A1A / #4A4A4A / #0066FF）· 消息数 16 → 12（合并连续自消息）</p>
</main>
</body>
</html>
